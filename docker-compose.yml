services:
  postgres:
    image: postgres:16-alpine
    container_name: duora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duora
      POSTGRES_PASSWORD: duora
      POSTGRES_DB: duora
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
